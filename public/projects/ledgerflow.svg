<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g opacity="0.06" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>
  <!-- Ledger book icon -->
  <g transform="translate(400,200)">
    <!-- Book base -->
    <rect x="-60" y="-70" width="120" height="140" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <!-- Spine -->
    <line x1="-60" y1="-70" x2="-60" y2="70" stroke="#10b981" stroke-width="3"/>
    <!-- Horizontal lines (ledger rows) -->
    <line x1="-45" y1="-40" x2="45" y2="-40" stroke="#10b981" stroke-width="0.8" opacity="0.4"/>
    <line x1="-45" y1="-15" x2="45" y2="-15" stroke="#10b981" stroke-width="0.8" opacity="0.4"/>
    <line x1="-45" y1="10" x2="45" y2="10" stroke="#10b981" stroke-width="0.8" opacity="0.4"/>
    <line x1="-45" y1="35" x2="45" y2="35" stroke="#10b981" stroke-width="0.8" opacity="0.4"/>
    <!-- DEBIT / CREDIT columns -->
    <line x1="-5" y1="-70" x2="-5" y2="70" stroke="#10b981" stroke-width="0.6" opacity="0.3"/>
    <!-- Entry marks -->
    <text x="-30" y="-27" font-family="monospace" font-size="9" fill="#10b981" opacity="0.7">DR</text>
    <text x="15" y="-27" font-family="monospace" font-size="9" fill="#f59e0b" opacity="0.7">CR</text>
    <text x="-30" y="-2" font-family="monospace" font-size="9" fill="#10b981" opacity="0.7">DR</text>
    <text x="15" y="-2" font-family="monospace" font-size="9" fill="#f59e0b" opacity="0.7">CR</text>
    <text x="-30" y="23" font-family="monospace" font-size="9" fill="#10b981" opacity="0.7">DR</text>
    <text x="15" y="23" font-family="monospace" font-size="9" fill="#f59e0b" opacity="0.7">CR</text>
    <!-- Balance indicator -->
    <circle cx="0" cy="-55" r="8" fill="url(#accent)"/>
    <text x="0" y="-52" font-family="monospace" font-size="7" fill="#fff" text-anchor="middle" font-weight="bold">=</text>
  </g>
  <!-- Title -->
  <text x="400" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#fff" text-anchor="middle" font-weight="700" letter-spacing="1">LedgerFlow</text>
  <text x="400" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Double-Entry Accounting Platform</text>
  <!-- Tech badges -->
  <g transform="translate(400,405)">
    <rect x="-180" y="-12" width="70" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="-145" y="3" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">Spring Boot</text>
    <rect x="-100" y="-12" width="80" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="-60" y="3" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">PostgreSQL</text>
    <rect x="-10" y="-12" width="55" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="17" y="3" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">Next.js</text>
    <rect x="55" y="-12" width="65" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="87" y="3" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">React Native</text>
    <rect x="130" y="-12" width="50" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="155" y="3" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">Docker</text>
  </g>
</svg>